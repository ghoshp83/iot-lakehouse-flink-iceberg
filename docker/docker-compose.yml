# IoT Lakehouse local stack.
# Kafka 4 (KRaft, no Zookeeper) + Schema Registry 8.2 (Confluent Platform 8.2 / Apache Kafka 4.2)
# Flink 2.2 on Java 17. HiveMQ CE for MQTT. MinIO for S3-compatible storage. Nessie as the Iceberg catalog.

networks:
  lakehouse:
    driver: bridge

volumes:
  minio-data:
  kafka-data:

services:

  kafka:
    image: confluentinc/cp-kafka:8.2.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node combined controller+broker.
      # CLUSTER_ID must be a 22-char base64 string (16 random bytes); pinning it
      # makes the kafka-data volume durable across restarts.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      # Production-grade defaults (single-node values; multi-broker: raise to 3/2)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # Log retention: 7 days, 1 GB per partition
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_CLEANUP_POLICY: 'delete'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  hivemq:
    image: hivemq/hivemq-ce:latest
    ports:
      - "1883:1883"   # MQTT
      - "8000:8000"   # MQTT over WebSocket
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    volumes:
      - minio-data:/data
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 admin admin12345; do sleep 1; done;
        mc mb -p local/warehouse || true;
        echo 'warehouse bucket ready';
      "
    networks: [lakehouse]
    restart: "no"

  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    ports:
      - "19120:19120"
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19120/api/v2/config > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  flink-jobmanager:
    image: flink:2.2.0-java17
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8081"   # Flink UI (remapped — HiveMQ uses 8080, SR uses 8081)
      - "9249:9249"   # Prometheus metrics
    environment:
      - ENABLE_BUILT_IN_PLUGINS=flink-s3-fs-hadoop-2.2.0.jar;flink-metrics-prometheus-2.2.0.jar
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend.type: rocksdb
        state.checkpoints.dir: s3://warehouse/flink-checkpoints/
        state.savepoints.dir: s3://warehouse/flink-savepoints/
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.min-pause: 10s
        execution.checkpointing.tolerable-failed-checkpoints: 3
        s3.endpoint: http://minio:9000
        s3.access-key: admin
        s3.secret-key: admin12345
        s3.path.style.access: true
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  flink-taskmanager:
    image: flink:2.2.0-java17
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - ENABLE_BUILT_IN_PLUGINS=flink-s3-fs-hadoop-2.2.0.jar;flink-metrics-prometheus-2.2.0.jar
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: rocksdb
        state.checkpoints.dir: s3://warehouse/flink-checkpoints/
        state.savepoints.dir: s3://warehouse/flink-savepoints/
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.min-pause: 10s
        execution.checkpointing.tolerable-failed-checkpoints: 3
        s3.endpoint: http://minio:9000
        s3.access-key: admin
        s3.secret-key: admin12345
        s3.path.style.access: true
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/taskmanagers > /dev/null || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Monitoring stack ---

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: --kafka.server=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/metrics > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      kafka-exporter:
        condition: service_healthy
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  trino:
    image: trinodb/trino:latest
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8083:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # --- Init services ---

  # Topic initialization: creates the main topic + DLQ topic idempotently on boot.
  kafka-init:
    image: confluentinc/cp-kafka:8.2.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'Creating topics...' &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic iot.telemetry --partitions 3 --replication-factor 1 \
          --config min.insync.replicas=1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic iot.telemetry.dlq --partitions 1 --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=2592000000 &&
        echo 'Topics ready'
      "
    networks: [lakehouse]
    restart: "no"
