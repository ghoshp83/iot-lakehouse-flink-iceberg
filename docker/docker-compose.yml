# IoT Lakehouse local stack.
# Kafka 4 (KRaft, no Zookeeper) + Schema Registry 8.2 (Confluent Platform 8.2 / Apache Kafka 4.2)
# Flink 2.2 on Java 17. HiveMQ CE for MQTT. MinIO for S3-compatible storage. Nessie as the Iceberg catalog.
# Start order: kafka (KRaft self-bootstraps) -> schema-registry -> hivemq -> minio -> nessie -> flink

networks:
  lakehouse:
    driver: bridge

volumes:
  minio-data:
  kafka-data:

services:

  kafka:
    image: confluentinc/cp-kafka:8.2.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node combined controller+broker.
      # CLUSTER_ID must be a 22-char base64 string (16 random bytes); pinning it
      # makes the kafka-data volume durable across restarts.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [lakehouse]

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    depends_on: [kafka]
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks: [lakehouse]

  hivemq:
    image: hivemq/hivemq-ce:latest
    ports:
      - "1883:1883"   # MQTT
      - "8000:8000"   # MQTT over WebSocket (HiveMQ CE has no HTTP control center — that's Enterprise only)
    networks: [lakehouse]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    volumes:
      - minio-data:/data
    networks: [lakehouse]

  # One-shot bucket creation. Iceberg sink writes to s3://warehouse/, so the
  # bucket must exist before the Flink job runs. Idempotent — `mc mb -p` no-ops if present.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 admin admin12345; do sleep 1; done;
        mc mb -p local/warehouse || true;
        echo 'warehouse bucket ready';
      "
    networks: [lakehouse]
    restart: "no"

  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    ports:
      - "19120:19120"
    networks: [lakehouse]

  flink-jobmanager:
    image: flink:2.2.0-java17
    command: jobmanager
    ports:
      - "8082:8081"   # Flink UI (remapped — HiveMQ uses 8080, SR uses 8081)
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    networks: [lakehouse]

  flink-taskmanager:
    image: flink:2.2.0-java17
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    networks: [lakehouse]
